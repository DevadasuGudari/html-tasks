<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms | Facebook Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 800px;
            padding: 50px;
        }

        h4 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 35px;
            color: #000;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            height: 72px;
            border: 1px solid #ccd0d5;
            border-radius: 18px;
            padding: 0 20px;
            font-size: 18px;
            margin-bottom: 18px;
            outline: none;
            background: #fff;
        }

        input::placeholder {
            color: #606770;
        }

        .login-btn {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 30px;
            background: #1877f2;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .login-btn:hover {
            background: #166fe5;
        }

        .forgot {
            padding: 20px;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            margin: 28px 0 80px;
            transition: 0.3s;
        }

        .forgot:hover {
            background-color: lightgray;
        }

        .create-btn {
            padding: 20px;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            border: 2px solid #166fe5;
            color: #000;
            font-size: 18px;
            margin: 28px 0 80px;
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h4>Log in to Facebook</h4>

        <form>
            <input type="text" placeholder="Email address or mobile number">

            <input type="password" placeholder="Password">

            <button type="submit" class="login-btn">Log in</button>

            <a href="#" class="forgot">Forgotten password?</a>

            <a href="./signupform.html" class="create-btn">Create new account</a>

        </form>
    </div>

</body>

</html>
</body>

</html>
