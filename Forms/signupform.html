<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms | Sign Up Facebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: justify;
        }

        .signup-container p {
            width: 550px;
        }

        input {
            height: 60px;
            padding: 0 20px;
            border-radius: 18px;
            border: 1px solid #ccd0d5;
            font-size: 18px;
            outline: none;
            background-color: #fff;
        }

        .birth select {
            width: 31%;
            height: 60px;
            padding: 0 20px;
            border-radius: 18px;
            border: 1px solid #ccd0d5;
            font-size: 18px;
            outline: none;
            background-color: #fff;
        }

        .gender select {
            width: 95%;
            height: 60px;
            padding: 0 20px;
            border-radius: 18px;
            border: 1px solid #ccd0d5;
            font-size: 18px;
            outline: none;
            background-color: #fff;
        }

        .mobile input {
            width: 95%;
        }

        .password input {
            width: 95%;
        }

        .submit-btn {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 30px;
            background: #1877f2;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .submit-btn:hover {
            background-color: #166fe5;
        }

        .account {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px;
            border: 1px solid lightgray;
            border-radius: 30px;
            text-decoration: none;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .account:hover {
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <h2>Get started on Facebook</h2>
        <br>
        <p>Create an account to connect with friends, family and communities of people who share your interests.</p>
        <br>

        <form>
            <h4>Name</h4>
            <input type="text" placeholder="First name" />
            <input type="text" placeholder="Surname" />
            <br> <br>

            <div class="birth">
                <h4>Date Of Birth</h4>
                <select required>
                    <option value="" disabled selected>Day</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
                    <option>13</option>
                    <option>14</option>
                    <option>15</option>
                    <option>16</option>
                    <option>17</option>
                    <option>18</option>
                    <option>19</option>
                    <option>20</option>
                    <option>21</option>
                    <option>22</option>
                    <option>23</option>
                    <option>24</option>
                    <option>25</option>
                    <option>26</option>
                    <option>27</option>
                    <option>28</option>
                    <option>29</option>
                    <option>30</option>
                    <option>31</option>
                </select>

                <!-- Month -->
                <select required>
                    <option value="" disabled selected>Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>
                </select>
                <!-- Year -->
                <select required>
                    <option value="" disabled selected>Year</option>
                    <option>2026</option>
                    <option>2025</option>
                    <option>2024</option>
                    <option>2023</option>
                    <option>2022</option>
                    <option>2021</option>
                    <option>2020</option>
                    <option>2019</option>
                    <option>2018</option>
                    <option>2017</option>
                    <option>2016</option>
                    <option>2015</option>
                    <option>2014</option>
                    <option>2013</option>
                    <option>2012</option>
                    <option>2011</option>
                    <option>2010</option>
                </select>
            </div>

            <br>

            <div class="gender">
                <h4>Gender</h4>
                <select required>
                    <option value="disabled selected">Select your gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Custom</option>
                </select>
            </div>

            <br>

            <div class="mobile">
                <h4>Mobile number or email address</h4>
                <input type="text" placeholder="Mobile number or email address" />
            </div>

            <br>

            <div class="password">
                <h4>Password</h4>
                <input type="Password" placeholder="Password" />
            </div>

            <br>

            <button type="submit" class="submit-btn">Submit</button>

            <br><br>

            <a href="#" class="account">I already have an account</a>
        </form>
    </div>

</body>

</html>
